<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsroom Admin | Conflict of Interest</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Merriweather', 'serif'] },
                    colors: { brand: { bg: '#18181B', text: '#E4E4E7', accent: '#DC2626', card: '#27272A', border: '#3F3F46' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: theme('colors.brand.bg'); color: theme('colors.brand.text'); }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4">

    <!-- LOGIN SCREEN -->
    <div id="login-view" class="w-full max-w-md bg-brand-card p-8 border border-brand-border rounded-sm shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="uppercase font-black tracking-tighter leading-[0.85] text-3xl mb-2">
                <span class="text-white">Conflict</span><br><span class="text-brand-accent">Of Interest</span>
            </h1>
            <p class="text-xs text-brand-text/50 uppercase tracking-widest font-bold mt-4">Restricted Access Newsroom</p>
        </div>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-brand-text/70 uppercase tracking-wider mb-1">Admin Email</label>
                <input type="email" id="admin-email" required class="w-full px-4 py-3 bg-brand-bg border border-brand-border rounded-sm focus:outline-none focus:border-brand-accent text-white">
            </div>
            <div>
                <label class="block text-xs font-bold text-brand-text/70 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="admin-password" required class="w-full px-4 py-3 bg-brand-bg border border-brand-border rounded-sm focus:outline-none focus:border-brand-accent text-white">
            </div>
            <button type="submit" id="login-btn" class="w-full bg-brand-accent hover:bg-red-700 text-white font-bold uppercase tracking-wider py-4 rounded-sm transition-colors mt-4">
                Authenticate
            </button>
            <p id="login-error" class="text-brand-accent text-xs font-bold text-center hidden mt-2"></p>
        </form>
    </div>

    <!-- ADMIN DASHBOARD (Hidden until logged in) -->
    <div id="dashboard-view" class="hidden w-full max-w-4xl bg-brand-card p-8 border border-brand-border rounded-sm my-8">
        <div class="flex justify-between items-center mb-8 pb-4 border-b border-brand-border">
            <h2 class="text-xl font-black uppercase tracking-widest text-white">Newsroom Editor</h2>
            <button id="logout-btn" class="text-xs font-bold uppercase tracking-wider text-brand-text/60 hover:text-brand-accent transition-colors">Sign Out</button>
        </div>

        <form id="publish-form" class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-brand-text/70 uppercase tracking-wider mb-1">Headline</label>
                <input type="text" id="article-title" required placeholder="e.g., The Zero-Sum Game of AI Regulation" class="w-full px-4 py-3 bg-brand-bg border border-brand-border rounded-sm focus:outline-none focus:border-brand-accent text-white font-serif text-lg">
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold text-brand-text/70 uppercase tracking-wider mb-1">Topic Category</label>
                    <select id="article-topic" required class="w-full px-4 py-3 bg-brand-bg border border-brand-border rounded-sm focus:outline-none focus:border-brand-accent text-white appearance-none">
                        <option value="Law">Law</option>
                        <option value="Tech">Tech</option>
                        <option value="Politics">Politics</option>
                        <option value="Economy">Economy</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-brand-text/70 uppercase tracking-wider mb-1">Region Category</label>
                    <select id="article-region" class="w-full px-4 py-3 bg-brand-bg border border-brand-border rounded-sm focus:outline-none focus:border-brand-accent text-white appearance-none">
                        <option value="">Global / None</option>
                        <option value="EU">EU</option>
                        <option value="UK">UK</option>
                        <option value="USA">USA</option>
                        <option value="ASIA">ASIA</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-brand-text/70 uppercase tracking-wider mb-1">Cover Image URL</label>
                <input type="url" id="article-image" placeholder="https://placehold.co/1200x800" class="w-full px-4 py-3 bg-brand-bg border border-brand-border rounded-sm focus:outline-none focus:border-brand-accent text-white text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-brand-text/70 uppercase tracking-wider mb-1">Article Content</label>
                <textarea id="article-content" required rows="12" placeholder="Write your analysis here. Separate paragraphs by hitting 'Enter' twice." class="w-full px-4 py-3 bg-brand-bg border border-brand-border rounded-sm focus:outline-none focus:border-brand-accent text-white font-serif leading-relaxed"></textarea>
            </div>

            <button type="submit" id="publish-btn" class="w-full bg-brand-accent hover:bg-red-700 text-white font-bold uppercase tracking-wider py-5 rounded-sm transition-colors text-lg">
                Publish to Live Site
            </button>
            <p id="publish-success" class="text-green-500 text-sm font-bold text-center hidden mt-4 uppercase tracking-widest">Article Published Successfully!</p>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // YOUR NEW FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyD_RTuc2UWLdY1alYIepeXImkvCjjh2tP0",
            authDomain: "conflict-of-interest-14ba9.firebaseapp.com",
            projectId: "conflict-of-interest-14ba9",
            storageBucket: "conflict-of-interest-14ba9.firebasestorage.app",
            messagingSenderId: "432704946243",
            appId: "1:432704946243:web:c9e231be7925f8d57394f6",
            measurementId: "G-2NQ5843NVP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginView = document.getElementById('login-view');
        const dashboardView = document.getElementById('dashboard-view');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const loginBtn = document.getElementById('login-btn');
        const publishForm = document.getElementById('publish-form');
        const publishSuccess = document.getElementById('publish-success');
        const publishBtn = document.getElementById('publish-btn');

        // Check if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
            } else {
                loginView.classList.remove('hidden');
                dashboardView.classList.add('hidden');
            }
        });

        // Real Email/Password Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            loginBtn.textContent = "Authenticating...";
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
                loginError.classList.add('hidden');
            } catch (error) {
                loginError.textContent = "Access Denied. Check credentials.";
                loginError.classList.remove('hidden');
            } finally {
                loginBtn.textContent = "Authenticate";
            }
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await signOut(auth);
            document.getElementById('admin-password').value = '';
        });

        // Publish to Database
        publishForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!auth.currentUser) return;

            publishBtn.textContent = "Publishing...";
            publishBtn.disabled = true;

            const title = document.getElementById('article-title').value;
            const topic = document.getElementById('article-topic').value;
            const region = document.getElementById('article-region').value;
            const image = document.getElementById('article-image').value || "https://placehold.co/1200x800/27272A/DC2626?text=Conflict+Of+Interest";
            const content = document.getElementById('article-content').value;
            const categories = region ? `${topic} ${region}` : topic;

            try {
                // Save to real database "articles" collection
                await addDoc(collection(db, 'articles'), {
                    title: title,
                    category: categories,
                    imageUrl: image,
                    content: content,
                    author: "The Editor",
                    readTime: "5 Min Read",
                    createdAt: serverTimestamp()
                });
                
                publishSuccess.classList.remove('hidden');
                publishForm.reset();
                setTimeout(() => publishSuccess.classList.add('hidden'), 4000);
            } catch (error) {
                alert("Error publishing: " + error.message);
                console.error(error);
            } finally {
                publishBtn.textContent = "Publish to Live Site";
                publishBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
